name: Build on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload mod JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/hypixelcommands-*.jar
